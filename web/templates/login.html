{% extends 'base.html' %}

{% block title %}PMLA-SCWE Login{% endblock %}

{% block auth_content %}
<div class="auth-container">
  <div class="auth-card glass">
    <h2>PMLA-SCWE</h2>
    <p class="sub">Predictive Learning & Cyber-Wellness Engine</p>

    {% if error %}
      <div class="alert-danger">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('auth.login') }}" method="POST">
      <div class="form-group">
        <label for="username">Administrator Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="e.g. admin" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <input type="submit" class="btn btn-primary btn-block" value="AUTHORIZE ACCESS">
    </form>
  </div>
</div>
{% endblock %}
